# Builds the Windows release on every push with tools/windows.sh, the same
# way it's built locally from Git Bash (as Majestic Media Player's is). What
# ships (catwalk.exe, the README and licenses, see tools/windows.sh stage) is
# attached to the run as an artifact; pushing a v* tag also publishes a
# GitHub Release.
name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # only used by the release step

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash  # Git Bash, which windows.sh expects
    steps:
      - uses: actions/checkout@v4

      # The runner already has Visual Studio with the C++ workload and the
      # Windows SDK (rc.exe, for the icon); only Nim is missing. An exact
      # version, so a release is built with the Nim the last one was.
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.14'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: tools/windows.sh build

      - name: Package
        id: pkg
        run: |
          name="catwalk-$(cat VERSION)-windows-x64"
          [[ $GITHUB_REF == refs/tags/* ]] || name+="-${GITHUB_SHA::7}"
          tools/windows.sh stage "$name"
          7z a "$name.zip" "$name" >/dev/null
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}/

      # Starts the packaged catwalk.exe as a player gets it, with PATH cut to
      # Windows' own folders, so a library missing from the zip fails here
      # rather than on their PC (0.2.0 needed a pcre64.dll it didn't ship).
      # A library that won't load opens a message box that waits for a
      # click: the timeouts stop the step instead.
      - name: Check that catwalk.exe starts
        timeout-minutes: 3
        run: |
          cd "${{ steps.pkg.outputs.name }}"
          rc=0
          out=$(PATH="/c/Windows/System32:/c/Windows" /usr/bin/timeout 60 ./catwalk.exe --version) || rc=$?
          out=$(tr -d '\r' <<< "$out")
          echo "catwalk.exe --version: '$out' (exit $rc)"
          want="Catwalk $(tr -d '\r\n' < ../VERSION)"
          if [[ $rc != 0 || $out != "$want" ]]; then
            echo "::error::catwalk.exe didn't start (expected '$want', exit 0)"
            exit 1
          fi

      # Release notes = the annotated tag's message ("What's new"). checkout
      # only fetches the tagged commit, so the tag object itself is fetched
      # to read its message.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.name }}.zip
          body_path: release-notes.md
